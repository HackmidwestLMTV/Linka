<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linka Mobile Trigger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-slate-800 p-8 rounded-2xl max-w-sm w-full border border-slate-700 shadow-2xl text-center">
        <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
            <i class="fa-solid fa-ship"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2">Simulate Disruption</h2>
        <p class="text-slate-400 text-sm mb-8">Trigger a customs hold on Freight Batch #104 to demonstrate Linka's agentic FinOps bridge.</p>
        
        <button id="trigger-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-6 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.4)] transition-all active:scale-95 flex items-center justify-center gap-3">
            <i class="fa-solid fa-triangle-exclamation"></i> Trigger Tariff Hold
        </button>
        
        <div id="status" class="mt-6 text-sm font-medium text-emerald-400 hidden">
            <i class="fa-solid fa-check-circle mr-1"></i> Disruption event broadcasted
        </div>
    </div>

    <script>
        const socket = io();
        const btn = document.getElementById('trigger-btn');
        const status = document.getElementById('status');

        btn.addEventListener('click', () => {
            btn.disabled = true;
            btn.classList.add('opacity-50');
            
            socket.emit('TRIGGER_DISRUPTION', {
                batchId: "Batch-104",
                reason: "Section 301 Tariff Compliance Review",
                delayDays: 14
            });

            status.classList.remove('hidden');
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                status.classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
